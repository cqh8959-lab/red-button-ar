<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="../site/img/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>團隊 AR 名片</title>
<link rel="stylesheet" href="../style.css?v=20261130">
<link rel="stylesheet" href="team.css?v=20261130">
<script type="importmap">
{ "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/addons/"
} }
</script>
</head>
<body>
  <!-- 開始畫面 -->
  <div id="start" class="screen">
    <div class="brand">
      <img class="wordmark" src="../site/img/wordmark.png" alt="主編的紅色按鈕" style="width:min(70vw,300px);height:auto">
      <div class="sub"><span>團隊 AR 名片</span></div>
    </div>
    <p class="lead" id="who">把手機鏡頭對準名片正面，<br>名片上會浮出一片透明的介紹。</p>
    <button id="btnCamera" class="primary">開啟相機，掃描名片</button>
    <a id="btnPreview" class="ghost" href="?preview">沒有名片？先看預覽</a>
    <p class="note">需要允許使用相機。建議用 iPhone 的 Safari 或 Android 的 Chrome 打開。</p>
  </div>

  <!-- AR 畫面 -->
  <div id="ar"></div>

  <!-- 上方：四位成員 -->
  <div id="bar" class="hidden"></div>

  <!-- 掃描提示 -->
  <div id="scan" class="hidden">
    <div class="frame"><span></span><span></span><span></span><span></span><i class="line"></i></div>
    <p>把鏡頭對準名片正面</p>
  </div>

  <div id="preview-tip" class="hidden">點特質卡翻面・拖曳轉動</div>
  <div id="toast" class="hidden"></div>

  <!-- 回到正面（轉了視角或翻了卡片之後才出現） -->
  <button id="home" type="button" aria-label="回到正面">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>回到正面</span>
  </button>

  <script type="module" src="team.js?v=20261129"></script>
</body>
</html>
